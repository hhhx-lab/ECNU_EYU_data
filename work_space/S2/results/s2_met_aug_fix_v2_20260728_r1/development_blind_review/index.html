<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Fix-v2 Development Blind Review</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f4;
      --surface: #ffffff;
      --surface-muted: #f7f8fa;
      --ink: #20252b;
      --muted: #69727d;
      --line: #d7dce2;
      --blue: #1769aa;
      --green: #18794e;
      --green-soft: #e5f4ec;
      --red: #b4232c;
      --red-soft: #fbe9ea;
      --amber: #8a5700;
      --shadow: 0 4px 18px rgb(20 28 36 / 10%);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button, input, textarea { font: inherit; letter-spacing: 0; }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }

    button:hover { border-color: #9da6b0; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 3px solid rgb(23 105 170 / 24%);
      outline-offset: 1px;
    }

    button:disabled { cursor: not-allowed; opacity: 0.45; }

    .appbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
      align-items: center;
      min-height: 64px;
      padding: 9px 18px;
      border-bottom: 1px solid var(--line);
      background: rgb(255 255 255 / 96%);
      backdrop-filter: blur(10px);
    }

    .brand h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 700;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .progress-block {
      display: grid;
      min-width: min(38vw, 460px);
      gap: 5px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 4px;
      background: #e3e7eb;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: var(--green);
      transition: width 160ms ease;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .command {
      min-height: 36px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 650;
    }

    .primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      min-height: calc(100vh - 64px);
    }

    .viewer-pane {
      min-width: 0;
      padding: 14px;
    }

    .viewer-toolbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      min-height: 44px;
      margin-bottom: 10px;
      gap: 12px;
    }

    .nav-group, .zoom-group, .filters {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zoom-group { justify-content: flex-end; }

    .icon-button {
      display: inline-grid;
      width: 36px;
      height: 36px;
      place-items: center;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }

    .counter {
      min-width: 92px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .filters {
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      padding: 3px;
    }

    .filter-button {
      min-height: 30px;
      padding: 0 11px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .filter-button.active {
      background: #e9eef3;
      color: var(--ink);
    }

    .zoom-value {
      min-width: 50px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .image-stage {
      position: relative;
      height: calc(100vh - 142px);
      min-height: 520px;
      overflow: auto;
      border: 1px solid #cfd5db;
      border-radius: 6px;
      background: #dfe3e7;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .image-stage img {
      display: block;
      width: 72%;
      min-width: 420px;
      max-width: none;
      height: auto;
      margin: 0 auto;
      background: #fff;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: var(--surface-muted);
      font-size: 13px;
    }

    .review-pane {
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
      border-left: 1px solid var(--line);
      background: var(--surface);
      padding: 20px;
    }

    .review-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .blind-code {
      margin: 0;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 17px;
      line-height: 1.35;
    }

    .bin-label {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-pill {
      flex: 0 0 auto;
      min-width: 72px;
      padding: 5px 7px;
      border-radius: 5px;
      background: #eceff2;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .status-pill.accept { background: var(--green-soft); color: var(--green); }
    .status-pill.reject { background: var(--red-soft); color: var(--red); }

    .field { margin-top: 18px; }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .field input, .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 9px 10px;
    }

    .field textarea {
      min-height: 112px;
      resize: vertical;
      line-height: 1.45;
    }

    .decision-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 20px;
    }

    .decision {
      min-height: 46px;
      font-weight: 750;
    }

    .decision.accept {
      border-color: #78b598;
      background: var(--green-soft);
      color: var(--green);
    }

    .decision.reject {
      border-color: #dfa4a8;
      background: var(--red-soft);
      color: var(--red);
    }

    .decision.selected.accept { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
    .decision.selected.reject { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }

    .clear-decision {
      width: 100%;
      min-height: 34px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .audit {
      margin-top: 22px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .audit code {
      display: block;
      margin-top: 4px;
      overflow-wrap: anywhere;
      color: #444d56;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .empty-state {
      display: none;
      height: calc(100vh - 142px);
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
    }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 40;
      max-width: min(420px, calc(100vw - 44px));
      padding: 11px 14px;
      border-radius: 6px;
      background: #22282e;
      color: #fff;
      box-shadow: var(--shadow);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    #import-file { display: none; }

    @media (max-width: 980px) {
      .appbar {
        grid-template-columns: 1fr auto;
      }

      .progress-block { grid-column: 1 / -1; grid-row: 2; min-width: 0; margin-top: 8px; }
      .top-actions { grid-column: 2; grid-row: 1; }

      .workspace { grid-template-columns: 1fr; }
      .review-pane { position: static; height: auto; border-top: 1px solid var(--line); border-left: 0; }
      .image-stage { height: 70vh; }
      .viewer-toolbar { grid-template-columns: 1fr auto; }
      .filters { grid-column: 1 / -1; grid-row: 2; }
    }

    @media (max-width: 640px) {
      .appbar { padding: 9px 12px; }
      .brand p { display: none; }
      .command { width: 36px; padding: 0; overflow: hidden; color: transparent; }
      .command::before { display: grid; width: 34px; height: 34px; place-items: center; color: var(--ink); }
      #import-button::before { content: "\21E9"; }
      #export-button::before { content: "\21E7"; color: #fff; }
      .viewer-pane { padding: 8px; }
      .viewer-toolbar { grid-template-columns: 1fr; gap: 6px; }
      .nav-group { grid-column: 1; grid-row: 1; justify-content: center; }
      .zoom-group { grid-column: 1; grid-row: 2; justify-content: center; }
      .filters { grid-column: 1; grid-row: 3; }
      .filter-button { padding: 0 7px; }
      .zoom-group input { width: 90px; }
      .image-stage img { min-width: 300px; }
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <h1>Development Blind Review</h1>
      <p>Fix-v2 / immutable evidence set</p>
    </div>
    <div class="progress-block" aria-label="Review progress">
      <div class="progress-meta">
        <span id="progress-count">0 / 240 reviewed</span>
        <span id="decision-counts">0 accepted / 0 rejected</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="top-actions">
      <button class="command" id="import-button" type="button" title="Import review CSV">Import</button>
      <button class="command primary" id="export-button" type="button" title="Export review CSV">Export</button>
      <input id="import-file" type="file" accept=".csv,text/csv">
    </div>
  </header>

  <main class="workspace">
    <section class="viewer-pane">
      <div class="viewer-toolbar">
        <div class="nav-group">
          <button class="icon-button" id="previous-button" type="button" title="Previous image" aria-label="Previous image">&#8592;</button>
          <span class="counter" id="position-count">1 / 240</span>
          <button class="icon-button" id="next-button" type="button" title="Next image" aria-label="Next image">&#8594;</button>
        </div>
        <div class="filters" role="group" aria-label="Decision filter">
          <button class="filter-button active" type="button" data-filter="all">All</button>
          <button class="filter-button" type="button" data-filter="pending">Pending</button>
          <button class="filter-button" type="button" data-filter="accept">Accepted</button>
          <button class="filter-button" type="button" data-filter="reject">Rejected</button>
        </div>
        <div class="zoom-group">
          <button class="icon-button" id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">&#8722;</button>
          <input id="zoom-slider" type="range" min="35" max="180" step="5" value="72" aria-label="Image zoom">
          <span class="zoom-value" id="zoom-value">72%</span>
          <button class="icon-button" id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
          <button class="icon-button" id="fullscreen-button" type="button" title="Full screen" aria-label="Full screen">&#x26F6;</button>
        </div>
      </div>

      <div class="image-stage" id="image-stage">
        <div class="loading" id="loading">Loading image</div>
        <img id="montage" alt="Blinded MRI candidate montage">
      </div>
      <div class="empty-state" id="empty-state">No images in this filter.</div>
    </section>

    <aside class="review-pane">
      <div class="review-header">
        <div>
          <h2 class="blind-code" id="blind-code">-</h2>
          <div class="bin-label" id="bin-label">-</div>
        </div>
        <span class="status-pill" id="status-pill">pending</span>
      </div>

      <div class="field">
        <label for="reviewer">Reviewer</label>
        <input id="reviewer" type="text" autocomplete="name" spellcheck="false">
      </div>

      <div class="decision-grid">
        <button class="decision accept" id="accept-button" type="button">Accept</button>
        <button class="decision reject" id="reject-button" type="button">Reject</button>
      </div>
      <button class="clear-decision" id="clear-button" type="button">Return to pending</button>

      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" spellcheck="true"></textarea>
      </div>

      <div class="audit">
        Evidence SHA-256
        <code id="evidence-sha">-</code>
        Source template SHA-256
        <code id="template-sha">-</code>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="review_data.js"></script>
  <script>
    (() => {
      "use strict";

      const rows = Array.isArray(window.REVIEW_ROWS) ? window.REVIEW_ROWS : [];
      const meta = window.REVIEW_META || {};
      if (!rows.length) throw new Error("Review data is missing");

      const fields = [
        "blind_code", "event_id", "core_volume_bin", "montage_path",
        "artifact_path", "evidence_sha256", "review_decision", "reviewer",
        "reviewed_at_utc", "notes"
      ];
      const immutableFields = [
        "blind_code", "event_id", "core_volume_bin", "montage_path",
        "artifact_path", "evidence_sha256"
      ];
      const rowByCode = new Map(rows.map((row) => [row.blind_code, row]));
      const storageKey = `fix-v2-development-review:${meta.template_sha256 || "v1"}`;
      const saved = loadSaved();
      const decisions = {};
      for (const row of rows) {
        decisions[row.blind_code] = normalizeDecision(saved.decisions?.[row.blind_code] || row);
      }

      let filter = "all";
      let currentCode = rows[0].blind_code;
      let zoom = Number(saved.zoom) || 72;
      let toastTimer = 0;

      const elements = {
        progressCount: document.querySelector("#progress-count"),
        decisionCounts: document.querySelector("#decision-counts"),
        progressFill: document.querySelector("#progress-fill"),
        positionCount: document.querySelector("#position-count"),
        previous: document.querySelector("#previous-button"),
        next: document.querySelector("#next-button"),
        montage: document.querySelector("#montage"),
        imageStage: document.querySelector("#image-stage"),
        loading: document.querySelector("#loading"),
        empty: document.querySelector("#empty-state"),
        blindCode: document.querySelector("#blind-code"),
        binLabel: document.querySelector("#bin-label"),
        status: document.querySelector("#status-pill"),
        reviewer: document.querySelector("#reviewer"),
        notes: document.querySelector("#notes"),
        accept: document.querySelector("#accept-button"),
        reject: document.querySelector("#reject-button"),
        clear: document.querySelector("#clear-button"),
        evidenceSha: document.querySelector("#evidence-sha"),
        templateSha: document.querySelector("#template-sha"),
        zoomSlider: document.querySelector("#zoom-slider"),
        zoomValue: document.querySelector("#zoom-value"),
        zoomOut: document.querySelector("#zoom-out"),
        zoomIn: document.querySelector("#zoom-in"),
        fullscreen: document.querySelector("#fullscreen-button"),
        importButton: document.querySelector("#import-button"),
        importFile: document.querySelector("#import-file"),
        exportButton: document.querySelector("#export-button"),
        toast: document.querySelector("#toast")
      };

      elements.reviewer.value = saved.reviewer || "";
      elements.templateSha.textContent = meta.template_sha256 || "unavailable";
      setZoom(zoom);
      render();

      elements.previous.addEventListener("click", () => navigate(-1));
      elements.next.addEventListener("click", () => navigate(1));
      elements.accept.addEventListener("click", () => setDecision("accept"));
      elements.reject.addEventListener("click", () => setDecision("reject"));
      elements.clear.addEventListener("click", () => setDecision("pending"));
      elements.zoomOut.addEventListener("click", () => setZoom(zoom - 10));
      elements.zoomIn.addEventListener("click", () => setZoom(zoom + 10));
      elements.zoomSlider.addEventListener("input", (event) => setZoom(Number(event.target.value)));
      elements.fullscreen.addEventListener("click", toggleFullscreen);
      elements.importButton.addEventListener("click", () => elements.importFile.click());
      elements.importFile.addEventListener("change", importCsv);
      elements.exportButton.addEventListener("click", exportCsv);
      elements.reviewer.addEventListener("input", persist);
      elements.notes.addEventListener("input", () => {
        const state = decisions[currentCode];
        if (!state) return;
        state.notes = elements.notes.value;
        persist();
      });
      elements.montage.addEventListener("load", () => {
        elements.loading.style.display = "none";
      });
      elements.montage.addEventListener("error", () => {
        elements.loading.textContent = "Image unavailable";
      });

      document.querySelectorAll("[data-filter]").forEach((button) => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          document.querySelectorAll("[data-filter]").forEach((item) => {
            item.classList.toggle("active", item === button);
          });
          const visible = getVisibleRows();
          if (visible.length && !visible.some((row) => row.blind_code === currentCode)) {
            currentCode = visible[0].blind_code;
          }
          render();
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        const tag = document.activeElement?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        if (event.key === "ArrowLeft") navigate(-1);
        if (event.key === "ArrowRight") navigate(1);
        if (event.key.toLowerCase() === "a") setDecision("accept");
        if (event.key.toLowerCase() === "r") setDecision("reject");
      });

      function normalizeDecision(value) {
        const decision = String(value.review_decision || "pending").toLowerCase();
        return {
          review_decision: ["accept", "reject"].includes(decision) ? decision : "pending",
          reviewer: String(value.reviewer || ""),
          reviewed_at_utc: String(value.reviewed_at_utc || ""),
          notes: String(value.notes || "")
        };
      }

      function getVisibleRows() {
        if (filter === "all") return rows;
        return rows.filter((row) => decisions[row.blind_code].review_decision === filter);
      }

      function render() {
        const visible = getVisibleRows();
        const row = rowByCode.get(currentCode);
        const visibleIndex = visible.findIndex((item) => item.blind_code === currentCode);
        const isEmpty = !visible.length;
        elements.imageStage.style.display = isEmpty ? "none" : "block";
        elements.empty.style.display = isEmpty ? "grid" : "none";
        elements.previous.disabled = isEmpty || visible.length < 2;
        elements.next.disabled = isEmpty || visible.length < 2;
        elements.positionCount.textContent = isEmpty ? `0 / 0` : `${visibleIndex + 1} / ${visible.length}`;
        renderProgress();
        if (isEmpty || !row) return;

        const state = decisions[row.blind_code];
        elements.loading.style.display = "grid";
        elements.loading.textContent = "Loading image";
        const nextSrc = `../development_run_attempt_01/${row.montage_path}`;
        if (elements.montage.getAttribute("src") !== nextSrc) {
          elements.montage.setAttribute("src", nextSrc);
          elements.imageStage.scrollTo({ top: 0, left: 0 });
        } else if (elements.montage.complete) {
          elements.loading.style.display = "none";
        }
        elements.blindCode.textContent = row.blind_code;
        elements.binLabel.textContent = `Core volume bin: ${row.core_volume_bin}`;
        elements.evidenceSha.textContent = row.evidence_sha256;
        elements.notes.value = state.notes;
        elements.status.textContent = state.review_decision;
        elements.status.className = `status-pill ${state.review_decision}`;
        elements.accept.classList.toggle("selected", state.review_decision === "accept");
        elements.reject.classList.toggle("selected", state.review_decision === "reject");
      }

      function renderProgress() {
        const values = Object.values(decisions).map((value) => value.review_decision);
        const accepted = values.filter((value) => value === "accept").length;
        const rejected = values.filter((value) => value === "reject").length;
        const reviewed = accepted + rejected;
        elements.progressCount.textContent = `${reviewed} / ${rows.length} reviewed`;
        elements.decisionCounts.textContent = `${accepted} accepted / ${rejected} rejected`;
        elements.progressFill.style.width = `${(reviewed / rows.length) * 100}%`;
      }

      function navigate(delta) {
        const visible = getVisibleRows();
        if (!visible.length) return;
        let index = visible.findIndex((row) => row.blind_code === currentCode);
        if (index < 0) index = 0;
        index = (index + delta + visible.length) % visible.length;
        currentCode = visible[index].blind_code;
        render();
      }

      function setDecision(value) {
        const reviewer = elements.reviewer.value.trim();
        if (value !== "pending" && !reviewer) {
          elements.reviewer.focus();
          showToast("Reviewer is required.");
          return;
        }
        const state = decisions[currentCode];
        if (!state) return;
        state.review_decision = value;
        state.reviewer = value === "pending" ? "" : reviewer;
        state.reviewed_at_utc = value === "pending" ? "" : new Date().toISOString();
        persist();

        if (value !== "pending") {
          const currentIndex = rows.findIndex((row) => row.blind_code === currentCode);
          const pending = rows.slice(currentIndex + 1).concat(rows.slice(0, currentIndex + 1))
            .find((row) => decisions[row.blind_code].review_decision === "pending");
          if (pending && (filter === "all" || filter === "pending")) currentCode = pending.blind_code;
        }
        render();
      }

      function setZoom(value) {
        zoom = Math.min(180, Math.max(35, Number(value) || 72));
        elements.zoomSlider.value = String(zoom);
        elements.zoomValue.textContent = `${zoom}%`;
        elements.montage.style.width = `${zoom}%`;
        persist();
      }

      async function toggleFullscreen() {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await elements.imageStage.requestFullscreen();
        } catch (error) {
          showToast("Full screen is unavailable.");
        }
      }

      function loadSaved() {
        try {
          return JSON.parse(localStorage.getItem(storageKey) || "{}") || {};
        } catch (error) {
          return {};
        }
      }

      function persist() {
        localStorage.setItem(storageKey, JSON.stringify({
          reviewer: elements?.reviewer?.value || saved.reviewer || "",
          zoom,
          decisions
        }));
      }

      function csvEscape(value) {
        const text = String(value ?? "");
        return /[",\r\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
      }

      function exportCsv() {
        const pendingCount = Object.values(decisions)
          .filter((value) => value.review_decision === "pending").length;
        if (pendingCount && !window.confirm(`Export with ${pendingCount} pending decisions?`)) return;
        const lines = [fields.join(",")];
        for (const row of rows) {
          const merged = { ...row, ...decisions[row.blind_code] };
          lines.push(fields.map((field) => csvEscape(merged[field])).join(","));
        }
        const blob = new Blob([`${lines.join("\r\n")}\r\n`], { type: "text/csv;charset=utf-8" });
        const link = document.createElement("a");
        const stamp = new Date().toISOString().replaceAll(":", "").replaceAll("-", "").replace(/\.\d{3}Z$/, "Z");
        link.href = URL.createObjectURL(blob);
        link.download = `DEVELOPMENT_BLINDED_REVIEW_DECISIONS_${stamp}.csv`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        showToast(pendingCount ? "Review snapshot exported." : "Completed decisions exported.");
      }

      async function importCsv(event) {
        const file = event.target.files?.[0];
        event.target.value = "";
        if (!file) return;
        try {
          const parsed = parseCsv(await file.text());
          if (parsed.length !== rows.length) throw new Error("row count does not match");
          const imported = new Map(parsed.map((row) => [row.blind_code, row]));
          if (imported.size !== rows.length) throw new Error("blind codes are missing or duplicated");
          for (const source of rows) {
            const candidate = imported.get(source.blind_code);
            if (!candidate) throw new Error(`missing blind code ${source.blind_code}`);
            for (const field of immutableFields) {
              if (String(candidate[field] || "") !== String(source[field] || "")) {
                throw new Error(`immutable field drift: ${field}`);
              }
            }
            decisions[source.blind_code] = normalizeDecision(candidate);
          }
          persist();
          render();
          showToast("Review CSV imported.");
        } catch (error) {
          showToast(`Import rejected: ${error.message}`);
        }
      }

      function parseCsv(text) {
        const table = [];
        let row = [];
        let value = "";
        let quoted = false;
        for (let index = 0; index < text.length; index += 1) {
          const char = text[index];
          if (quoted) {
            if (char === '"' && text[index + 1] === '"') {
              value += '"';
              index += 1;
            } else if (char === '"') {
              quoted = false;
            } else {
              value += char;
            }
          } else if (char === '"') {
            quoted = true;
          } else if (char === ",") {
            row.push(value);
            value = "";
          } else if (char === "\n") {
            row.push(value.replace(/\r$/, ""));
            if (row.some((cell) => cell !== "")) table.push(row);
            row = [];
            value = "";
          } else {
            value += char;
          }
        }
        if (value || row.length) {
          row.push(value.replace(/\r$/, ""));
          table.push(row);
        }
        if (quoted || table.length < 2) throw new Error("CSV is incomplete");
        const headers = table[0];
        if (fields.some((field) => !headers.includes(field))) throw new Error("required columns are missing");
        return table.slice(1).map((values) => Object.fromEntries(headers.map((header, index) => [header, values[index] || ""])));
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        elements.toast.textContent = message;
        elements.toast.classList.add("show");
        toastTimer = setTimeout(() => elements.toast.classList.remove("show"), 2600);
      }
    })();
  </script>
</body>
</html>
