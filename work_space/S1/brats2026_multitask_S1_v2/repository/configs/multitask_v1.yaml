seed: 42

data:
  train_split: data/splits/train_cases.txt
  val_split: data/splits/val_cases.txt
  data_root: data/sample50
  # Identical nonzero-brain Z-score for train / val / inference
  normalize: true

model:
  in_channels: 4
  feature_channels: 64
  tumor_classes: 4
  rc_classes: 2
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]
  num_res_units: 2

train:
  epochs: 3
  # Memory-safe defaults: micro-batch 1, accumulate to effective batch 2
  batch_size: 1
  gradient_accumulation: 2
  lr: 0.0003
  weight_decay: 0.00001
  num_workers: 4
  amp: true
  # auto -> BF16 on Ampere/Hopper, else FP16
  amp_dtype: auto
  resume: ""
  patch_size: [96, 96, 96]
  # Fallback if still OOM: set patch_size to [80, 80, 80]
  # 70-80% lesion-centered connected-component crops
  lesion_probability: 0.8
  scheduler: cosine
  min_lr: 0.000001
  early_stop_patience: 30
  early_stop_min_delta: 0.0001
  min_epochs: 1

loss:
  use_uncertainty: true
  # Clamp log-sigma so RC cannot be driven to ~0 weight
  max_log_sigma: 2.0
  min_log_sigma: -2.0
  fixed_tumor_weight: 1.0
  fixed_rc_weight: 1.0

augmentation:
  enabled: true
  flip_probability: 0.5
  affine_probability: 0.2
  rotation_radians: 0.10
  translation_voxels: 5.0
  scale_range: 0.08
  contrast_probability: 0.15
  gamma_range: [0.9, 1.1]
  noise_probability: 0.15
  noise_std: 0.01
  bias_field_probability: 0.1
  bias_field_coeff_range: [0.0, 0.05]

validation:
  # Full-volume joint sliding-window inference (not center crop)
  every_n_epochs: 1
  roi_size: [96, 96, 96]
  sw_batch_size: 1
  overlap: 0.5
  num_workers: 2
  small_lesion_volume_mm3: 27.0
  small_overlap_threshold: 0.2
  selection_weights:
    region_dice_mean: 0.5
    lesion_dice_proxy_mean: 0.25
    small_f1_proxy_mean: 0.25

checkpoint:
  save_dir: experiments/checkpoints
  save_every: 5

logging:
  tensorboard_dir: experiments/tensorboard
  log_every: 5

inference:
  output_dir: experiments/predictions
